name: Z.E.L.D.A. CI

on:
  push:
  pull_request:

jobs:
  controlled-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run controlled runtime tests
        run: python -m pytest -q tests/test_provider_contract.py tests/test_ollama_provider.py
